name: PR Project Build

permissions:
  contents: read

# When this builds (Jumoo/jumoo-context#159, from its templates/workflows/dotnet-build.yml):
#
# - Dependabot PRs. Nobody builds those locally, so CI is the only check they get.
# - Other PRs: no. /commit-pr builds and tests locally before opening the PR. The
#   build job is skipped, which still satisfies a required status check.
# - Nightly: each v{N}/main with commits in the last day, so a break from combined
#   changes shows up the next morning. Dispatched, so each branch builds with its own
#   copy of this file.
# - On demand: Actions > Run workflow, on any branch.
#
# NOTE: this repo releases from "v17/main" - a branch per Umbraco major, matching the
# rest of Jumoo. Plain "main" is kept in the filter so a re-created main, or a branch
# that hasn't been moved over yet, still builds.
on:
  pull_request:
    branches: [ "main", "*/main" ]
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# event_name keeps the nightly dispatcher out of the group of the build it dispatches on
# the default branch, which would otherwise cancel it before it reached the other branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  config: Release
  solution: ./uSync.CommandLine.sln
  # Umbraco.Site is a local test site, not something CI needs to build - it is
  # deliberately left out of this list.
  build_projects: >-
    ./uSync.FolderChecks/uSync.FolderChecks.csproj
    ./uSync.Commands.Core/uSync.Commands.Core.csproj
    ./uSync.Commands/uSync.Commands.csproj
    ./uSync/uSync.csproj
    ./uSync.Command.Setup/uSync.Command.Setup.csproj
    ./uSync.Command.Notify/uSync.Command.Notify.csproj
    ./SwaggerClientGen/SwaggerClientGen.csproj

jobs:
  # Schedules only run on the default branch, so this job dispatches the build on each
  # release branch that changed, rather than building it here.
  nightly:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: dispatch a build for each branch changed in the last day
        run: |
          since=$(date -u -d '25 hours ago' +%s)
          gh api "repos/$GITHUB_REPOSITORY/branches" --paginate -q '.[].name' \
            | grep -E '^(v[0-9]+/)?main$' \
            | while read -r branch; do
                committed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" -q .commit.committer.date)
                if [ "$(date -u -d "$committed" +%s)" -ge "$since" ]; then
                  echo "$branch changed $committed - building"
                  # an old branch (v13/main) may not have this workflow; don't let it stop the rest
                  gh workflow run dotnet-build.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
                    || echo "::warning::couldn't dispatch a build on $branch"
                else
                  echo "$branch unchanged since $committed - skipping"
                fi
              done

  build-project:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # restoring the whole solution, not just the projects being built, keeps every
      # packages.lock.json in the repo checked against --locked-mode, including Site's.
      - name: restore
        run: dotnet restore ${{ env.solution }} --locked-mode

      - name: build
        # one dotnet build per line, not wrapped - a folded (">") scalar only joins
        # lines indented the same as the "for"/"done" lines, so a wrapped command
        # indented deeper stays on its own line and "-c" runs as its own command.
        run: |
          for project in ${{ env.build_projects }}; do
            dotnet build "$project" -c ${{ env.config }} --no-restore -p:ContinuousIntegrationBuild=true
          done

      - name: test
        run: dotnet test ./uSync.FolderChecks.Tests/uSync.FolderChecks.Tests.csproj -c ${{ env.config }} --no-restore
